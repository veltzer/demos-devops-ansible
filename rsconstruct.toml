# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The auditor persona, zizmor's strictest: everything the pedantic one
# reports (undocumented permissions, template expansion of any context,
# unnamed jobs, ...) plus the findings that need a person to judge them.
# --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=auditor"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_dirs = [".github"]
src_files = ["get_one_spot.yaml", "show_all_instances.yaml", "show_all_my_instances.yaml", ".yamllint.yaml"]

# lint the Lua configuration with luacheck (policy: .luacheckrc)
[processor.checker.iluacheck]
src_dirs = ["config"]

# every lint suppression names a rule and says why (see the fleet's CLAUDE.md)
[processor.checker.suppressions]
src_dirs = [".github", "config"]
src_files = [".yamllint.yaml", "README.md", "get_one_spot.yaml", "show_all_instances.yaml", "show_all_my_instances.yaml"]
